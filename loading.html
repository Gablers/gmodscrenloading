<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMod Loading Screen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevents scrollbars */
        }

        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Replace 'background.jpg' with your image name or URL */
            background-image: url('background.jpg'); 
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center center;
            z-index: -1; /* Keeps the background behind your text/UI */
        }

        /* You can put your server name, rules, or loading bars inside this box */
        .content {
            color: white;
            font-family: Arial, sans-serif;
            padding: 40px;
        }
    </style>
</head>
<body>

    <!-- This div holds your perfectly stretched background -->
    <div class="background-container"></div>

    <!-- Your actual loading screen content goes here -->
    <div class="content">
        <h1>Welcome to My GMod Server</h1>
        <p>Loading files, please wait...</p>
    </div>

</body>
</html>
